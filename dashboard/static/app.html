<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__ASSISTANT_NAME__ Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0f1d; --surface: rgba(255,255,255,0.04); --border: rgba(100,190,210,0.24);
      --accent: #06b6d4; --adim: rgba(6,182,212,0.14); --text: #e6f4f5; --muted: #78939a;
      --green: #10b981; --gdim: rgba(16,185,129,0.14); --panel: #101b2a;
      --header-bg: rgba(10,15,29,0.95); --footer-bg: rgba(10,15,29,0.95);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font-body, 'Segoe UI', sans-serif);
      display: flex; flex-direction: column; overflow: hidden;
    }
    body[data-theme="cyber"] { --font-body: 'Cascadia Code', Consolas, monospace; }
    body[data-theme="clinical"] { --font-body: 'Trebuchet MS', sans-serif; letter-spacing: .01em; }
    body[data-theme="crt"] { --font-body: 'Courier New', monospace; letter-spacing: .04em; }
    body[data-theme="obsidian"] { --font-body: 'Segoe UI', sans-serif; }
    body[data-theme="parchment"] { --font-body: Georgia, 'Times New Roman', serif; }
    body[data-theme="synthwave"] { --font-body: 'Trebuchet MS', sans-serif; }
    body[data-theme="crt"]::before { content: ''; position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: .1; background: repeating-linear-gradient(0deg, transparent 0 3px, #8affb0 4px); }
    body[data-theme="synthwave"] { background: linear-gradient(135deg, #0f0724 0%, #24104b 55%, #12052a 100%); }
    body[data-theme="parchment"] { background: #fcf7ea; }
    body[data-theme="studio"] { --font-body: 'Trebuchet MS', 'Segoe UI', sans-serif; background: radial-gradient(circle at 86% 8%, rgba(255,115,87,.16), transparent 23%), #f7f3ee; }
    body[data-theme="studio"] header { border-bottom: 0; padding: 18px 24px 12px; background: transparent; }
    body[data-theme="studio"] .logo { color: #2e2530; letter-spacing: 3px; }
    body[data-theme="studio"] .pill { background: #fffaf5; border-color: #e8dcd2; }
    body[data-theme="studio"] #workspace { margin: 0 18px 14px; border: 1px solid #e8dcd2; border-radius: 22px; overflow: hidden; background: rgba(255,252,248,.72); box-shadow: 0 20px 50px rgba(85,54,36,.08); }
    body[data-theme="studio"] #history { background: rgba(255,250,245,.68); border-right-color: #eadfd5; }
    body[data-theme="studio"] .history-item { border-radius: 11px; }
    body[data-theme="studio"] .msg { border-radius: 18px; box-shadow: 0 5px 14px rgba(88,58,46,.05); }
    body[data-theme="studio"] .msg-j { background: #fffaf5; border-color: #f0ddd0; border-bottom-left-radius: 5px; }
    body[data-theme="studio"] .msg-u { background: #ffe2d8; border-color: #ffd0c3; border-bottom-right-radius: 5px; }
    body[data-theme="studio"] footer { margin: 0 18px 18px; border: 1px solid #e8dcd2; border-radius: 18px; background: #fffaf5; box-shadow: 0 12px 28px rgba(85,54,36,.08); }
    body[data-theme="studio"] #inp { background: #fff; border-color: #eadfd5; border-radius: 14px; }
    body[data-theme="studio"] .theme-panel, body[data-theme="studio"] .memory-panel { border-color: #eadfd5; box-shadow: 0 24px 80px rgba(85,54,36,.18); }
    body[data-theme="paper"] { --font-body: Georgia, 'Times New Roman', serif; background: #f1efe8; }
    body[data-theme="paper"] header { padding: 18px 28px; background: #f1efe8; border-bottom-color: #d9d5ca; }
    body[data-theme="paper"] .logo { font-family: Georgia, serif; font-size: 17px; letter-spacing: 1px; font-weight: 500; }
    body[data-theme="paper"] .pill { border-radius: 4px; background: transparent; border-color: #d9d5ca; }
    body[data-theme="paper"] #workspace { margin: 0 28px; border-top: 1px solid #d9d5ca; }
    body[data-theme="paper"] #history { background: transparent; border-right: 1px solid #d9d5ca; }
    body[data-theme="paper"] .history-item { border-radius: 2px; padding: 9px 6px; }
    body[data-theme="paper"] .msg { border-radius: 4px; box-shadow: none; }
    body[data-theme="paper"] .msg-j { background: #fbfaf6; border-color: #ddd9ce; border-left: 3px solid #3f776c; border-bottom-left-radius: 0; }
    body[data-theme="paper"] .msg-u { background: #e2ebe5; border-color: #c9dbd0; border-bottom-right-radius: 0; }
    body[data-theme="paper"] footer { margin: 12px 28px 20px; padding: 8px; border: 1px solid #d9d5ca; background: #fbfaf6; }
    body[data-theme="paper"] #inp { background: transparent; border: 0; border-bottom: 1px solid #c8c6bd; border-radius: 0; }
    body[data-theme="paper"] .btn { border-radius: 4px; }
    body[data-theme="paper"] .theme-panel, body[data-theme="paper"] .memory-panel { border-radius: 4px; border-color: #d9d5ca; }
    body[data-theme="studio"] .theme-card[data-theme="studio"], body[data-theme="paper"] .theme-card[data-theme="paper"] { background: #fffaf5; }
    body[data-theme="paper"] .theme-card[data-theme="paper"] { background: #fbfaf6; }
    body[data-theme="clinical"] .msg { border-radius: 3px; }
    body[data-theme="clinical"] .btn { border-radius: 3px; }
    body[data-theme="obsidian"] * { box-shadow: none !important; }
    body[data-theme="obsidian"] .msg { border-radius: 3px; }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: var(--header-bg);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
    #memory-modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.68); }
    #memory-modal[hidden] { display: none; }
    .memory-panel { width: min(560px, 92vw); max-height: 80vh; overflow-y: auto; padding: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
    #theme-modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.68); }
    #theme-modal[hidden] { display: none; }
    .theme-panel { width: min(680px, 94vw); max-height: 82vh; overflow-y: auto; padding: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
    .theme-panel h2 { margin-bottom: 12px; font-size: 17px; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .theme-card { text-align: left; padding: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    .theme-card.active { border-color: var(--accent); outline: 2px solid var(--adim); }
    .theme-card strong { display: block; font-size: 12px; margin-bottom: 4px; }
    .theme-card small { color: var(--muted); font-size: 10px; line-height: 1.4; }
    .accent-row { display: flex; gap: 9px; margin-top: 15px; flex-wrap: wrap; }
    .accent-swatch { width: 25px; height: 25px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .accent-swatch.active { border-color: var(--text); outline: 2px solid var(--accent); }
    .memory-panel h2 { margin-bottom: 12px; font-size: 16px; }
    .memory-row { display: flex; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); font-size: 12px; }
    .memory-row span { flex: 1; }
    .memory-category { color: var(--accent); font-size: 9px; letter-spacing: 1px; }
    #metrics-strip { display:flex; gap:8px; padding:7px 14px; border-bottom:1px solid var(--border); background:var(--header-bg); overflow-x:auto; }
    .metric-chip { min-width:94px; padding:5px 8px; border:1px solid var(--border); border-radius:7px; background:var(--surface); }
    .metric-chip small { display:block; color:var(--muted); font-size:8px; letter-spacing:1px; }
    .metric-chip strong { display:block; color:var(--accent); font-size:12px; margin-top:2px; }

    /* ── HISTORY ── */
    #workspace { flex: 1; min-height: 0; display: flex; }
    #history { width: 250px; flex-shrink: 0; padding: 12px; border-right: 1px solid var(--border); background: rgba(0,0,0,0.12); overflow-y: auto; }
    #history h2 { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
    #history-search { width: 100%; padding: 8px 9px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; }
    .history-group { margin: 12px 0 5px; color: var(--muted); font-size: 9px; letter-spacing: 1.4px; text-transform: uppercase; }
    .history-item { display: flex; gap: 5px; align-items: center; padding: 7px 5px; border-radius: 7px; cursor: pointer; }
    .history-item:hover, .history-item.active { background: var(--adim); }
    .history-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
    .history-time { color: var(--muted); font-size: 9px; flex-shrink: 0; }
    .history-action { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px; }
    .history-action:hover { color: var(--accent); }
    .msg-tools { display:flex; gap:7px; margin-top:7px; opacity:.55; }
    .msg:hover .msg-tools { opacity:1; }
    .msg-tool { border:0; background:transparent; color:var(--muted); cursor:pointer; padding:0; font-size:11px; }
    .msg-tool:hover { color:var(--accent); }
    .msg-time { float:right; margin-left:12px; color:var(--muted); font-size:9px; opacity:.7; }
    #workspace main { min-width: 0; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:var(--footer-bg); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media (max-width: 560px) {
      body[data-theme="studio"] #workspace, body[data-theme="studio"] footer { margin-left: 8px; margin-right: 8px; }
      body[data-theme="paper"] #workspace, body[data-theme="paper"] footer { margin-left: 10px; margin-right: 10px; }
      #history { width: 190px; }
      header { padding: 10px 12px; gap: 7px; }
      .logo { font-size: 13px; letter-spacing: 4px; }
      .url, .enc-badge { display: none !important; }
      main { padding: 12px 10px 6px; }
      .msg, .msg-file { max-width: 92%; }
      footer { padding: 8px 10px; gap: 6px; }
      #inp { min-width: 0; padding: 10px; }
      .btn { padding: 10px 11px; letter-spacing: 1px; }
      #mic-btn, .btn-attach { padding: 10px 11px; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo" id="assistant-brand" data-name="__ASSISTANT_NAME__"><em>__ASSISTANT_INITIAL__</em>__ASSISTANT_NAME_REST__</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <button class="btn" style="padding:6px 9px;background:var(--surface);color:var(--muted);border:1px solid var(--border)" onclick="openMemories()">MEMORY</button>
    <button class="btn" style="padding:6px 9px;background:var(--surface);color:var(--muted);border:1px solid var(--border)" onclick="openThemes()">THEME</button>
    <button class="btn" id="fork-btn" style="padding:6px 9px;background:var(--surface);color:var(--muted);border:1px solid var(--border)" onclick="forkActive()" title="Fork this conversation">FORK</button>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <section id="metrics-strip" aria-label="Live system metrics">
    <div class="metric-chip"><small>CPU</small><strong id="metric-cpu">--</strong></div>
    <div class="metric-chip"><small>MEMORY</small><strong id="metric-mem">--</strong></div>
    <div class="metric-chip"><small>GPU</small><strong id="metric-gpu">--</strong></div>
    <div class="metric-chip"><small>NETWORK</small><strong id="metric-net">--</strong></div>
    <div class="metric-chip"><small>MONITORS</small><strong id="metric-monitors">0</strong></div>
  </section>
  <div id="memory-modal" hidden>
    <section class="memory-panel">
      <h2>Manage AI Memories</h2>
      <div id="memory-list"></div>
      <input id="new-memory" placeholder="Add a memory fact" style="width:100%;margin-top:12px;padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text)">
      <select id="new-memory-category" style="width:100%;margin-top:7px;padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text)">
        <option>USER_PREFERENCES</option><option>TECH_STACK</option><option>PROJECT_CONTEXT</option><option>CORRECTION_HABITS</option>
      </select>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn" onclick="closeMemories()">CLOSE</button><button class="btn btn-send" onclick="addMemory()">ADD</button></div>
    </section>
  </div>
  <div id="theme-modal" hidden>
    <section class="theme-panel">
      <h2>Choose Interface Theme</h2>
      <div id="theme-grid" class="theme-grid"></div>
      <div class="memory-category" style="margin-top:16px">ACCENT COLOR</div>
      <div id="accent-row" class="accent-row"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeThemes()">CLOSE</button></div>
    </section>
  </div>
  <div id="workspace">
    <aside id="history">
      <h2>Conversations</h2>
      <input id="history-search" placeholder="Search history" autocomplete="off">
      <button class="btn btn-send" style="width:100%;padding:8px;margin-bottom:4px" onclick="newSession()">NEW CHAT</button>
      <div id="history-list"></div>
    </aside>
    <main id="feed"></main>
  </div>
  <footer>
    <input id="inp" placeholder="Send a command to __ASSISTANT_NAME__…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('friday_token');
    const _sessionKey = sessionStorage.getItem('friday_key');
    let activeSessionId = null;

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    const THEME_ARCHETYPES = {
      cyber: {name:'Cyber-Defense Ops', detail:'Tactical telemetry cockpit', bg:'#0a0f1d', surface:'rgba(255,255,255,.04)', border:'rgba(100,190,210,.24)', text:'#e6f4f5', muted:'#78939a', panel:'#101b2a', header:'rgba(10,15,29,.95)'},
      clinical: {name:'Clinical Studio', detail:'Swiss high-contrast light', bg:'#f8fafc', surface:'#ffffff', border:'#e2e8f0', text:'#0f172a', muted:'#64748b', panel:'#ffffff', header:'rgba(248,250,252,.96)'},

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'FRIDAY-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');

    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');

    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           { append(m.speaker, m.text); if (m.speaker === 'friday') loadSessions(); }
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
      if (m.type === 'assistant_config') applyAssistantName(m.name);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');

    function append(speaker, text, messageId = '', timestamp = '') {
      const d = document.createElement('div');
      if (speaker === 'friday') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">${esc(assistantName)}${timestamp ? `<span class="msg-time">${esc(formatTime(timestamp))}</span>` : ''}</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You${timestamp ? `<span class="msg-time">${esc(formatTime(timestamp))}</span>` : ''}</div>${esc(text)}`;
      }
      if (messageId) {
        const tools = document.createElement('div'); tools.className = 'msg-tools';
        const addTool = (label, title, action) => {
          const button = document.createElement('button'); button.className = 'msg-tool';
          button.textContent = label; button.title = title;
          button.onclick = (event) => { event.stopPropagation(); action(); };
          tools.appendChild(button);
        };
        addTool('↗', 'Quote / reply', () => quoteMessage(text));
        addTool('⧉', 'Copy message', () => copyMessage(text));
        if (speaker === 'user') addTool('✎', 'Edit prompt', () => editMessage(messageId, text));
        if (speaker === 'friday') {
          addTool('↻', 'Regenerate response', () => regenerateMessage(messageId));
          addTool('⑂', 'Branch from this message', () => branchAt(messageId));
        }
        d.appendChild(tools);
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    function formatTime(value) {
      const date = new Date(value);

    async function loadSessions() {
      const query = document.getElementById('history-search').value.trim();
      const response = await _authFetch('/api/sessions?query=' + encodeURIComponent(query));
      if (!response.ok) return;
      const data = await response.json();
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      for (const [group, sessions] of Object.entries(data.groups || {})) {
        if (!sessions.length) continue;
        const heading = document.createElement('div');
        heading.className = 'history-group'; heading.textContent = group; list.appendChild(heading);
        for (const session of sessions) {
          const row = document.createElement('div');
          row.className = 'history-item' + (session.id === activeSessionId ? ' active' : '');
          row.innerHTML = `<span class="history-title">${session.pinned ? '★ ' : ''}${esc(session.title)}</span><span class="history-time">${esc(formatTime(session.updated_at))}</span>`;
          const pin = document.createElement('button'); pin.className = 'history-action'; pin.textContent = session.pinned ? '★' : '☆'; pin.title = session.pinned ? 'Unpin' : 'Pin';
          pin.onclick = (event) => { event.stopPropagation(); updateSession(session.id, {pinned: !session.pinned}); };
          const rename = document.createElement('button'); rename.className = 'history-action'; rename.textContent = 'Rename';
          rename.onclick = (event) => { event.stopPropagation(); renameSession(session); };
          const remove = document.createElement('button'); remove.className = 'history-action'; remove.textContent = 'Delete';
          remove.onclick = (event) => { event.stopPropagation(); deleteSession(session.id); };
          row.append(pin, rename, remove); row.onclick = () => selectSession(session.id); list.appendChild(row);
        }
      }
    }

    async function selectSession(id) {
      const response = await _authFetch('/api/sessions/' + encodeURIComponent(id));
      if (!response.ok) return;
      const session = await response.json(); activeSessionId = session.id; feed.innerHTML = '';
      for (const message of session.messages || []) {
        if (message.role === 'system' || message.role === 'tool') continue;
        append(message.role === 'assistant' ? 'friday' : 'user', message.content, message.id, message.timestamp);
      }
      loadSessions();
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    async function refreshMetrics() {
      try {
        const response = await _authFetch('/api/metrics');
        if (!response.ok) return;
        const payload = await response.json();
        const metrics = payload.metrics || {};
        const value = (key, suffix = '%') => metrics[key] === undefined || metrics[key] < 0 ? 'N/A' : `${Number(metrics[key]).toFixed(1)}${suffix}`;
        document.getElementById('metric-cpu').textContent = value('cpu');
        document.getElementById('metric-mem').textContent = value('mem');
        document.getElementById('metric-gpu').textContent = value('gpu');
        document.getElementById('metric-net').textContent = value('net', ' MB/s');
        document.getElementById('metric-monitors').textContent = String((payload.active_monitors || []).length);
      } catch (_) {}
    }
    refreshMetrics();
    setInterval(refreshMetrics, 2500);

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
</html>
