[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-l"
version = "1.0.0"
description = "A voice-driven personal AI assistant with desktop control, memory, and browser integration"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "PyQt6",
  "sounddevice",
  "google-genai",
  "google-generativeai",
  "pillow",
  "requests",
  "beautifulsoup4",
  "duckduckgo-search",
  "playwright",
  "pyautogui",
  "pyperclip",
  "pygetwindow",
  "opencv-python",
  "numpy",
  "mss",
  "psutil",
  "send2trash",
  "youtube-transcript-api",
  "python-pptx",
  "qrcode[pil]"
]

[project.optional-dependencies]
dashboard = ["fastapi", "uvicorn[standard]", "cryptography", "python-multipart"]
browser = ["playwright"]
windows = ["comtypes; sys_platform == 'win32'", "pycaw; sys_platform == 'win32'", "win10toast; sys_platform == 'win32'", "pywinauto; sys_platform == 'win32'", "pywin32; sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
